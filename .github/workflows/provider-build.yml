name: Provider desktop build
on:
  push:
    branches: ['codex/provider-access-lifecycle-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: pnpm exec tauri build --bundles nsis --config src-tauri/tauri.provider-build.conf.json
        if: runner.os == 'Windows'
      - run: pnpm exec tauri build --bundles app --config src-tauri/tauri.provider-build.conf.json
        if: runner.os == 'macOS'
      - name: Preserve macOS app modes and symlinks
        if: runner.os == 'macOS'
        run: tar -czf switcher-macos.tar.gz -C src-tauri/target/release/bundle/macos 'Codex Switcher.app'
      - uses: actions/upload-artifact@v4
        with:
          name: switcher-${{ runner.os }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            switcher-macos.tar.gz
